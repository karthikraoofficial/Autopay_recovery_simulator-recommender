[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rebound"
version = "0.1.0"
description = "Recurring payment recovery simulator (India)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The guardrail tests import modules that do not exist yet, on purpose. Without this,
# isort cannot resolve them and sorts them as third-party.
known-first-party = ["rebound"]
