    unit: ratio
    source: "Placeholder link between subscription ticket and monthly income."
    confidence: estimate

  book.customer.spend_decay_rate:
    value: 0.09
    unit: ratio_per_day
    source: "Placeholder. Real value is fitted in phase 4."
    confidence: estimate

  book.customer.balance_lognormal_sigma:
    value: 0.45
    unit: ratio
    source: "Placeholder. Real value is fitted in phase 4."
    confidence: estimate

