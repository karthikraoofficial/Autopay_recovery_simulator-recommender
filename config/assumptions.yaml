    unit: ratio
    source: "Placeholder rail mix. No NPCI volume file read."
    confidence: estimate

  book.mandate_cap_multiple_of_ticket:
    value: 3.0
    unit: ratio
    source: "Placeholder. Merchants typically set headroom above the ticket."
    confidence: estimate

  book.bank_count:
