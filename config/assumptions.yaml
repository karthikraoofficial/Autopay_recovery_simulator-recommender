# Every number used anywhere in rebound lives here. Nothing is hardcoded in Python.
#
# Entry schema (all fields required except `notes`):
#   <dotted.key>:
#     value:      number | string | bool
#     unit:       str    - "INR", "ratio", "days", "count", "hour_of_day", ...
#     source:     str    - where the number came from. If it is not from a
#                          document I can open, say so plainly. Never cite a
#                          circular that has not been read.
#     confidence: primary | practitioner | estimate
#     notes:      str    - optional; what would change this number
#
# confidence levels:
#   primary      - taken from an RBI/NPCI circular or a published NPCI data file
#   practitioner - stated by someone operating real mandate volume
#   estimate     - our guess. Must also appear in open_questions below.

version: 1

assumptions:
  harness.performance_fee_rate:
    value: 0.15
    unit: ratio
    source: "SPEC.md §5.1 default. Commercial parameter, not a measured quantity."
    confidence: estimate
    notes: "Set per merchant contract. Drives the net-to-merchant headline directly."

  harness.bootstrap_seeds:
    value: 50
    unit: count
    source: "SPEC.md §5.1 default. Chosen for runtime, not from a power calculation."
    confidence: estimate
    notes: "Raise until confidence intervals stop moving between runs."

  rail.upi_autopay.mandate_cap_default_inr:
    value: 15000
    unit: INR
    source: "SPEC.md §1.1, which itself flags this as unverified. No circular read."
    confidence: estimate
    notes: "Higher cap applies to select categories. Verify against current NPCI UPI Autopay circular before any external use."

  harness.max_attempts_per_cycle:
    value: 4
    unit: count
    source: "Runaway-loop stop for the phase-2 harness. Not a regulatory cap."
    confidence: estimate
    notes: "Runaway-loop stop only. The binding limit is now the per-rail compliance.max_retries_per_cycle.* cap, which is lower on every rail, so this should never be what truncates a chain."

  harness.bootstrap_resamples:
    value: 2000
    unit: count
    source: "Conventional bootstrap resample count. Not derived from a target CI width."
    confidence: estimate
    notes: "Raise until interval endpoints stop moving in the third significant figure."

  harness.confidence_level:
    value: 0.90
    unit: ratio
    source: "Chosen for a sales context, not a scientific one. 0.95 is the stricter default."
    confidence: estimate
    notes: "Widen to 0.95 before any external claim."

  harness.baseline_strategy:
    value: "FixedSchedule"
    unit: name
    source: "SPEC.md §4: everything is measured against what merchants do today."
    confidence: primary
    notes: "Paired lift intervals are computed as strategy minus this."

  strategy.fixed_schedule.retry_offsets_days:
    value: [1, 3, 7]
    unit: days
    source: "SPEC.md §4.1 states T+1, T+3, T+7 as the common merchant default."
    confidence: practitioner
    notes: "Frozen by definition. Changing it changes what the baseline means, not how good it is."

  # --- Strategy: ReasonAware (SPEC §4.3) -------------------------------------------
  # Branch on the reason code. The delays below are the strategy's whole content, so a
  # lift result for ReasonAware is a claim about these six numbers. None is measured;
  # they encode the recovery characteristics SPEC §1.3 attaches to each code.

  strategy.reason_aware.technical_decline_delay_hours:
    value: 2
    unit: hours
    source: "SPEC.md §4.3 states 'technical decline -> retry in 2 hours' directly."
    confidence: practitioner
    notes: "Legal only while compliance.pre_debit_notification.retry_inherits_original_notice is true. Under the strict reading this retry is blocked outright and ReasonAware loses its main advantage over the baseline."

  strategy.reason_aware.bank_unavailable_delay_hours:
    value: 6
    unit: hours
    source: "Guess. SPEC.md §1.3 calls BANK_UNAVAILABLE very highly recoverable once the downtime window closes, but ReasonAware may not read downtime windows -- that is BankAware in phase 7 -- so it waits a fixed period instead."
    confidence: estimate

  strategy.reason_aware.insufficient_funds_delay_days:
    value: 3
    unit: days
    source: "Guess. SPEC.md §1.3 calls INSUFFICIENT_FUNDS a timing problem, so the strategy waits rather than hammering. Waiting for a predicted salary credit is SalaryAware in phase 7; this is the reason-blind version of the same instinct."
    confidence: estimate
    notes: "The single number ReasonAware's insufficient-funds branch rests on. Sweep it in phase 7 before quoting any lift attributable to this branch."

  strategy.reason_aware.limit_exceeded_delay_days:
    value: 1
    unit: days
    source: "SPEC.md §1.3: a daily or per-transaction cap resets, so the next day is the natural retry. Stated in the spec table, not measured."
    confidence: practitioner

  strategy.reason_aware.invalid_pin_delay_days:
    value: 1
    unit: days
    source: "Guess. SPEC.md §1.3 gives INVALID_PIN low recoverability and notes it does not apply to autopay execution, so this branch should almost never fire."
    confidence: estimate

  strategy.reason_aware.max_retries:
    value: 3
    unit: count
    source: "Matches the conservative per-rail compliance cap so the strategy stops on its own rather than being stopped by the guard. Not a regulatory number."
    confidence: estimate
    notes: "Set above compliance.max_retries_per_cycle.* and the guard blocks the surplus, which inflates the compliance-block count with retries the strategy should never have proposed."

  # --- Book shape ---------------------------------------------------------------
  # What is being simulated, as distinct from how the population is distributed.

  book.size:
    value: 2000
    unit: count
    source: "Chosen for test runtime. No merchant basis."
    confidence: estimate

  book.months:
    value: 12
    unit: count
    source: "SPEC.md §6 renders a 12-month chart."
    confidence: estimate

  book.start_date:
    value: "2026-01-01"
    unit: date
    source: "Simulation epoch. Arbitrary, but results depend on it via weekday alignment."
    confidence: estimate

  book.avg_ticket_paise:
    value: 49900
    unit: paise
    source: "Placeholder subscription ticket. No merchant basis."
    confidence: estimate

  # --- Rail mandate caps ---------------------------------------------------------
  # Regulatory/scheme ceilings, not book parameters. A generated mandate cap is
  # clipped to these, so a merchant cannot be simulated debiting above the rail limit.

  rail.enach.mandate_cap_inr:
    value: 10000000
    unit: INR
    source: "SPEC.md §1.1 states 'caps up to ₹1 crore'. No NPCI circular read."
    confidence: estimate
    notes: "Verify against the current NACH procedural guidelines before external use."

  rail.card_emandate.mandate_cap_inr:
    value: 1500000
    unit: INR
    source: "Guess. SPEC.md §1.1 gives an AFA threshold for cards, not a mandate ceiling; the two are different things and we have read neither circular."
    confidence: estimate
    notes: "The ₹15,000 figure in SPEC.md §1.1 is the additional-factor-of-authentication threshold. Modelling it as a hard cap would be wrong; this is a separate, invented ceiling."

  # --- Population: banks ---------------------------------------------------------
  # Phase 3. Every value here is a guess about the Indian banking system. NPCI
  # publishes per-bank technical-decline and uptime data monthly; none of it has been
  # read, and until it is, no per-bank number in this file is defensible.

  population.bank.count:
    value: 12
    unit: count
    source: "Placeholder. Real books concentrate in far fewer banks than they touch."
    confidence: estimate

  population.bank.share_concentration:
    value: 1.1
    unit: exponent
    source: "Zipf exponent on bank market share. Chosen to make a book concentrate in a handful of banks rather than spread uniformly. Not fitted."
    confidence: estimate
    notes: "0 gives a uniform book. Higher concentrates further. Drives how much a BankAware strategy can matter, so lift is sensitive to it."

  population.bank.td_rate_min:
    value: 0.005
    unit: ratio
    source: "Placeholder range for per-bank technical decline rate."
    confidence: estimate

  population.bank.td_rate_max:
    value: 0.045
    unit: ratio
    source: "Placeholder range for per-bank technical decline rate."
    confidence: estimate

  population.bank.uptime_daytime:
    value: 0.995
    unit: ratio
    source: "Placeholder best-hour availability for a median bank."
    confidence: estimate

  population.bank.uptime_night_trough:
    value: 0.955
    unit: ratio
    source: "Placeholder worst-hour availability for a median bank. Assumes a nightly dip around batch/maintenance hours."
    confidence: estimate

  population.bank.uptime_trough_hour:
    value: 2
    unit: hour_of_day
    source: "Placeholder hour of worst availability. Assumed to sit in the early morning."
    confidence: estimate

  population.bank.unavailability_factor_min:
    value: 0.4
    unit: ratio
    source: "Multiplier on a bank's downtime relative to the median bank; the low end is the best bank in the book."
    confidence: estimate

  population.bank.unavailability_factor_max:
    value: 2.5
    unit: ratio
    source: "Multiplier on a bank's downtime relative to the median bank; the high end is the worst bank in the book."
    confidence: estimate

  population.bank.downtime_windows_mean:
    value: 0.8
    unit: count
    source: "Placeholder mean number of recurring scheduled downtime windows per bank."
    confidence: estimate

  population.bank.downtime_windows_max:
    value: 2
    unit: count
    source: "Cap on the Poisson draw above, so no bank is generated permanently offline."
    confidence: estimate

  population.bank.downtime_window_hours:
    value: 2
    unit: hours
    source: "Placeholder length of a scheduled maintenance window."
    confidence: estimate

  population.bank.downtime_window_earliest_hour:
    value: 0
    unit: hour_of_day
    source: "Placeholder. Scheduled maintenance is assumed to sit overnight."
    confidence: estimate

  population.bank.downtime_window_latest_hour:
    value: 4
    unit: hour_of_day
    source: "Placeholder. Window start is drawn in [earliest, latest]; the window ends before 24:00 by construction."
    confidence: estimate

  population.bank.downtime_window_daily_share:
    value: 0.35
    unit: ratio
    source: "Share of generated windows that recur every day rather than on one weekday."
    confidence: estimate

  population.bank.batch_cutoff_hour:
    value: 17
    unit: hour_of_day
    source: "Placeholder eNACH presentation cutoff."
    confidence: estimate

  population.bank.return_charge_paise:
    value: 59000
    unit: paise
    source: "Placeholder bounce charge levied on eNACH return."
    confidence: estimate

  # --- Population: customers -----------------------------------------------------

  population.customer.band_share.low:
    value: 0.45
    unit: ratio
    source: "Placeholder income-band mix of a subscription book. No survey read."
    confidence: estimate

  population.customer.band_share.mid:
    value: 0.40
    unit: ratio
    source: "Placeholder income-band mix of a subscription book. No survey read."
    confidence: estimate

  population.customer.band_share.high:
    value: 0.15
    unit: ratio
    source: "Placeholder income-band mix of a subscription book. No survey read."
    confidence: estimate

  population.customer.income_median_paise.low:
    value: 2500000
    unit: paise
    source: "Placeholder median monthly income for the LOW band (₹25,000)."
    confidence: estimate

  population.customer.income_median_paise.mid:
    value: 5500000
    unit: paise
    source: "Placeholder median monthly income for the MID band (₹55,000)."
    confidence: estimate

  population.customer.income_median_paise.high:
    value: 15000000
    unit: paise
    source: "Placeholder median monthly income for the HIGH band (₹150,000)."
    confidence: estimate

  population.customer.income_lognormal_sigma:
    value: 0.30
    unit: ratio
    source: "Placeholder dispersion of income within a band."
    confidence: estimate

  population.customer.salary_day.month_end_share:
    value: 0.62
    unit: ratio
    source: "Placeholder. Indian payroll is assumed to cluster at month end, with a secondary cluster in the first week."
    confidence: estimate
    notes: "This split is what SalaryAware has to infer. If it is wrong, the inference problem in phase 7 is the wrong shape."

  population.customer.salary_day.month_end_min:
    value: 25
    unit: day_of_month
    source: "Placeholder start of the month-end payroll cluster."
    confidence: estimate

  population.customer.salary_day.month_end_max:
    value: 31
    unit: day_of_month
    source: "Placeholder end of the month-end payroll cluster. Clamped to the month's last day in short months."
    confidence: estimate

  population.customer.salary_day.month_start_min:
    value: 1
    unit: day_of_month
    source: "Placeholder start of the first-week payroll cluster."
    confidence: estimate

  population.customer.salary_day.month_start_max:
    value: 7
    unit: day_of_month
    source: "Placeholder end of the first-week payroll cluster."
    confidence: estimate

  population.customer.intent_score_mean:
    value: 0.90
    unit: ratio
    source: "Placeholder mean starting intent. Unobservable in reality."
    confidence: estimate

  population.customer.intent_score_concentration:
    value: 25.0
    unit: count
    source: "Beta concentration for starting intent. Higher means the book is more uniformly committed."
    confidence: estimate

  population.customer.has_alt_rail_share:
    value: 0.35
    unit: ratio
    source: "Placeholder share of customers reachable on a second rail."
    confidence: estimate

  population.customer.upi_app_share.app_a:
    value: 0.46
    unit: ratio
    source: "Placeholder UPI app mix. Apps are unnamed on purpose: we have not read the NPCI app-wise volume file and will not invent named market shares."
    confidence: estimate

  population.customer.upi_app_share.app_b:
    value: 0.35
    unit: ratio
    source: "See population.customer.upi_app_share.app_a."
    confidence: estimate

  population.customer.upi_app_share.app_c:
    value: 0.12
    unit: ratio
    source: "See population.customer.upi_app_share.app_a."
    confidence: estimate

  population.customer.upi_app_share.app_d:
    value: 0.07
    unit: ratio
    source: "See population.customer.upi_app_share.app_a."
    confidence: estimate

  # --- Population: balance process (SPEC §2.1) -----------------------------------
  # The emergent property these must produce is that P(insufficient funds) rises with
  # days since salary credit. Every value is a guess; the shape is the claim, not the
  # level, and phase 4 fits the level against a pilot merchant's reason-code mix.

  population.balance.spend_decay_rate.low:
    value: 0.075
    unit: ratio_per_day
    source: "Placeholder, back-solved so the median LOW-band account holds roughly 7% of a month's income when the next credit lands. Lower income is assumed to spend down fastest, so it is most exposed to a late-cycle debit."
    confidence: estimate
    notes: "Set by the end-of-cycle balance it implies, not measured. Raise it and late-cycle insufficient-funds risk saturates at 100%, which would make retry timing look worthless."

  population.balance.spend_decay_rate.mid:
    value: 0.060
    unit: ratio_per_day
    source: "Placeholder. See population.balance.spend_decay_rate.low."
    confidence: estimate

  population.balance.spend_decay_rate.high:
    value: 0.045
    unit: ratio_per_day
    source: "Placeholder. See population.balance.spend_decay_rate.low."
    confidence: estimate

  population.balance.first_week_days:
    value: 7
    unit: days
    source: "SPEC.md §2.1 asks for higher spend velocity in the first week; the boundary is a guess."
    confidence: estimate

  population.balance.first_week_spend_multiplier:
    value: 1.9
    unit: ratio
    source: "Placeholder multiplier on the decay rate inside the first week after credit."
    confidence: estimate

  population.balance.daily_lognormal_sigma.low:
    value: 0.55
    unit: ratio
    source: "Placeholder day-to-day balance volatility. Assumed highest in the LOW band."
    confidence: estimate

  population.balance.daily_lognormal_sigma.mid:
    value: 0.45
    unit: ratio
    source: "Placeholder day-to-day balance volatility."
    confidence: estimate

  population.balance.daily_lognormal_sigma.high:
    value: 0.35
    unit: ratio
    source: "Placeholder day-to-day balance volatility."
    confidence: estimate

  population.balance.cushion_lognormal_sigma:
    value: 0.90
    unit: ratio
    source: "Guess. Dispersion of how much cash a customer actually keeps, holding income fixed. Stands in for every determinant of account balance that is not income: other accounts, dependants, rent timing, existing obligations."
    confidence: estimate
    notes: "This single parameter sets what share of the book is thin-balance, and therefore the level of INSUFFICIENT_FUNDS the phase-4 engine can produce. At 0 the model has no insufficient-funds failures at a realistic subscription ticket at all. It is the most consequential unmeasured number in the population model and the first thing to fit against pilot merchant data."

  population.balance.carryover_fraction_mean:
    value: 0.12
    unit: ratio
    source: "Placeholder share of one month's income still in the account when the next credit lands."
    confidence: estimate

  population.balance.carryover_lognormal_sigma:
    value: 0.60
    unit: ratio
    source: "Placeholder dispersion of carryover across customers and months."
    confidence: estimate

  population.balance.salary_jitter_max_days:
    value: 2
    unit: days
    source: "SPEC.md §2.1 asks for 0-2 day jitter. Modelled as late-only: payroll slips, it does not run early."
    confidence: estimate

  population.balance.salary_shifts_before_weekend:
    value: true
    unit: bool
    source: "Assumption that a credit landing on a Saturday or Sunday is made on the preceding Friday. No holiday calendar is modelled."
    confidence: estimate
    notes: "Bank holidays are not modelled at all, so the shift is weekend-only and understates late-credit risk."

  # --- Population: mandates ------------------------------------------------------

  population.mandate.rail_mix.upi_autopay:
    value: 0.55
    unit: ratio
    source: "Placeholder rail mix. No NPCI volume file read."
    confidence: estimate

  population.mandate.rail_mix.enach:
    value: 0.30
    unit: ratio
    source: "Placeholder rail mix. No NPCI volume file read."
    confidence: estimate

  population.mandate.rail_mix.card_emandate:
    value: 0.15
    unit: ratio
    source: "Placeholder rail mix. No NPCI volume file read."
    confidence: estimate

  population.mandate.ticket_lognormal_sigma:
    value: 0.35
    unit: ratio
    source: "Placeholder dispersion of ticket size across the book."
    confidence: estimate

  population.mandate.cap_multiple_of_ticket:
    value: 3.0
    unit: ratio
    source: "Placeholder. Merchants typically set mandate headroom above the ticket."
    confidence: estimate

  population.mandate.billing_day_max:
    value: 28
    unit: day_of_month
    source: "Billing days are drawn uniformly over 1..this. 28 is a calendar fact, not an assumption: a higher fixed billing day has no meaning in February."
    confidence: estimate
    notes: "Uniform is certainly wrong — real books cluster on signup dates and month boundaries — but a spread book is what makes days-since-salary vary at debit time, which is the whole mechanism under test."

  population.mandate.max_age_months:
    value: 24
    unit: count
    source: "Placeholder oldest mandate at simulation start. Sets book tenure, which nothing currently reads."
    confidence: estimate

  # --- Compliance guard (SPEC §3) --------------------------------------------------
  # Phase 5. SPEC.md §11 flags every rule below as unverified: no RBI circular and no
  # NPCI procedural guideline has been read. These are `estimate` because they encode
  # our reading of SPEC §3, not because we measured anything, and a lift number that
  # depends on one of them is a claim about our reading rather than about the law.
  #
  # The two absolute rules carry a citation entry rather than a parameter. They are not
  # toggles: SPEC §1.3 says hard declines terminate retry chains with no exceptions and
  # no config flag to disable, so the guard refuses to start if either is set to
  # anything but "absolute".

  compliance.hard_decline_stop.rule:
    value: "absolute"
    unit: rule
    source: "SPEC.md §1.3 and §3, which state this without qualification. Not a measured quantity and not a switch."
    confidence: primary
    notes: "A citation, not a parameter. ComplianceGuard raises at construction if this is weakened, so the rule cannot be turned off by editing config."

  compliance.revocation_respect.rule:
    value: "absolute"
    unit: rule
    source: "SPEC.md §3: no attempt against a REVOKED mandate under any circumstance."
    confidence: primary
    notes: "A citation, not a parameter. See compliance.hard_decline_stop.rule."

  compliance.amount_integrity.rule:
    value: "equal_to_original"
    unit: rule
    source: "SPEC.md §3: retry amount must equal the original. Partial debits are named there as a separate feature requiring its own compliance analysis, so they are out of scope rather than disabled."
    confidence: primary
    notes: "A citation, not a parameter. Splitting a debit to fit an available balance would raise recovery on paper and is exactly the tactic §3 refuses to allow silently."

  compliance.pre_debit_notification.lead_hours:
    value: 24
    unit: hours
    source: "SPEC.md §3 states at least 24 hours. SPEC.md §11 lists the RBI e-mandate pre-debit notification rules as unverified, and no circular has been read."
    confidence: estimate
    notes: "If the real requirement is longer, every strategy's fastest legal retry moves out and measured lift falls."

  compliance.pre_debit_notification.retry_inherits_original_notice:
    value: true
    unit: bool
    source: "Our reading of SPEC.md §3's 'unless the rail/scenario exempts it': the original debit was notified 24h ahead and a retry of that same charge, for the same amount, carries that notice. No circular has been read and this is not a settled question."
    confidence: estimate
    notes: "The single largest regulatory risk in the model. Set false and every sub-24h retry is illegal, which removes the fast technical retry that ReasonAware depends on. Phase 7 must report headline lift under BOTH settings side by side, permanently, not as a ±50% sweep -- the flag is binary and the pessimistic number has to stay visible next to the optimistic one."

  compliance.max_retries_per_cycle.upi_autopay:
    value: 3
    unit: count
    source: "Deliberately conservative default, per SPEC.md §3. SPEC.md §11 asks whether retry caps are a hard NPCI limit or PG policy; that is unresolved, so this is our choice rather than a rule."
    confidence: estimate

  compliance.max_retries_per_cycle.enach:
    value: 2
    unit: count
    source: "Lower than the real-time rails because each eNACH return can carry a bank charge (SPEC.md §1.1), making an extra attempt cost money rather than merely an API call. Not a published limit."
    confidence: estimate

  compliance.max_retries_per_cycle.card_emandate:
    value: 3
    unit: count
    source: "Conservative default matching the UPI cap. No scheme rule read."
    confidence: estimate

  compliance.enach.clearing_weekdays:
    value: [0, 1, 2, 3, 4]
    unit: weekday_index
    source: "Monday-Friday, as Python weekday indices. SPEC.md §11 asks for the eNACH clearing calendar; it has not been obtained, so bank holidays are not modelled at all."
    confidence: estimate
    notes: "Holidays missing means the guard permits presentation on days NPCI would not clear, so compliance blocks are undercounted and recoverable revenue is overstated on eNACH."

  compliance.enach.presentation_cutoff.rule:
    value: "bank_batch_cutoff_time"
    unit: rule
    source: "SPEC.md §3 requires eNACH to respect batch cutoff times. The cutoff itself is per-bank and comes from population.bank.batch_cutoff_hour rather than being restated here."
    confidence: estimate
    notes: "Names where the cutoff is read from, so the rule has a source key like every other rule."

  # --- Failure engine (SPEC §2.2) -------------------------------------------------
  # Phase 4. The check order itself is fixed in code, not here; these are the rates
  # each check fires at. None is measured. `engine/calibration.py` reports how far the
  # mix these produce lands from a target distribution.

  engine.rail_technical_multiplier.upi_autopay:
    value: 1.00
    unit: ratio
    source: "Reference rail. SPEC.md §1.1 calls UPI Autopay real-time and stateless, with the highest failure rate, so the per-bank uptime and technical-decline rates are applied to it unscaled."
    confidence: estimate

  engine.rail_technical_multiplier.enach:
    value: 0.60
    unit: ratio
    source: "Guess. SPEC.md §1.1 says eNACH has higher execution stability than UPI, but gives no figure and none has been measured."
    confidence: estimate

  engine.rail_technical_multiplier.card_emandate:
    value: 0.35
    unit: ratio
    source: "Guess. SPEC.md §1.1 says card e-mandate has the lowest execution failure, but gives no figure and none has been measured."
    confidence: estimate
    notes: "The gap between the three rail multipliers is what makes rail choice matter to a strategy. It is invented, so any per-rail finding is a finding about this number."

  engine.mandate_expiry_hazard_per_cycle:
    value: 0.0015
    unit: ratio
    source: "Guess at the per-billing-cycle chance a mandate reaches its expiry and needs re-authorisation. Mandates carry no expiry date in the domain model, so expiry is modelled as a hazard rather than a date."
    confidence: estimate
    notes: "Drawn per cycle, so it persists across every retry in that cycle rather than flickering."

  engine.account_frozen_hazard_per_month:
    value: 0.0006
    unit: ratio
    source: "Guess at the monthly chance a customer's account is frozen. No basis."
    confidence: estimate

  engine.daily_limit_paise.upi_autopay:
    value: 10000000
    unit: paise
    source: "₹1,00,000, the commonly cited UPI per-day limit. Not read from an NPCI circular, and the autopay-specific limit may differ."
    confidence: estimate

  engine.daily_limit_paise.enach:
    value: 100000000
    unit: paise
    source: "Guess. Batch-cleared eNACH is not obviously subject to a per-day customer limit at all; a high value here effectively disables the check for this rail."
    confidence: estimate

  engine.daily_limit_paise.card_emandate:
    value: 50000000
    unit: paise
    source: "Guess at a card daily spend ceiling. Varies per issuer and per customer; a single number for the whole book is a simplification."
    confidence: estimate

  engine.daily_limit_consumption_share_mean:
    value: 0.15
    unit: ratio
    source: "Guess at the share of a customer's daily rail limit already consumed by their own spending when the mandate debit arrives. Without this the limit check could never fire for a small ticket."
    confidence: estimate

  engine.daily_limit_consumption_lognormal_sigma:
    value: 0.85
    unit: ratio
    source: "Guess. Wide, because LIMIT_EXCEEDED only fires in the tail where a customer has nearly exhausted the limit, so the tail is the whole mechanism. Narrowed from an initial 1.10 on face validity: that value made daily-limit exhaustion the second-largest failure category for a Rs 499 subscription, which is not credible."
    confidence: estimate
    notes: "Narrowed on plausibility, NOT fitted to a target mix. The only target available is itself invented, and tuning to it would produce a config that looks calibrated while being no better grounded."

  # --- Customer reaction model (SPEC §2.3) ----------------------------------------
  # The cost side of retrying. Without these, every strategy converges on retrying
  # infinitely, which SPEC.md §2.3 names as the failure mode to avoid.

  engine.reaction.revocation_base_hazard:
    value: 0.012
    unit: ratio
    source: "Guess at the chance a customer voluntarily cancels the mandate after a single failed attempt. Needs pilot merchant churn data."
    confidence: estimate
    notes: "This is the price of retry aggression. Set it to zero and unbounded retrying becomes optimal, which is the result SPEC.md §2.3 warns is wrong."

  engine.reaction.revocation_attempt_exponent:
    value: 1.35
    unit: exponent
    source: "Guess. Above 1 makes annoyance compound: the fourth retry costs more than the first. Chosen for that shape, not fitted."
    confidence: estimate
    notes: "1.0 makes revocation risk merely proportional to attempts. The super-linear choice is what makes an optimal retry count exist rather than the answer being 'retry to the compliance cap'."

  engine.reaction.revocation_intent_weight:
    value: 0.8
    unit: ratio
    source: "Guess at how much a customer who has lost interest in the service is likelier to cancel than a committed one."
    confidence: estimate

  engine.reaction.intent_decay_per_failed_attempt:
    value: 0.06
    unit: ratio
    source: "Guess. SPEC.md §2.3 requires intent to decay over an episode; the rate is invented."
    confidence: estimate

  engine.reaction.topup_probability_not_notified:
    value: 0.06
    unit: ratio
    source: "Guess at the chance a customer with full intent moves money in to cover a debit they were not told about. This is the floor case: a customer topping up by coincidence rather than in response."
    confidence: estimate
    notes: "Phase 4 runs entirely on this value, because nothing sets pre_debit_notified until the phase-5 compliance guard does."

  engine.reaction.topup_probability_notified:
    value: 0.22
    unit: ratio
    source: "Guess at the chance a customer with full intent tops up having received a pre-debit notification."
    confidence: estimate
    notes: "The ratio of this to topup_probability_not_notified is the single lever behind any lift attributed to notification, so sweep both in the phase-7 sensitivity analysis rather than quoting either alone."

  engine.calibration.seeds:
    value: 3
    unit: count
    source: "Seeds used by the default calibration run. Chosen for runtime, not from a precision target."
    confidence: estimate
    notes: "Raise until the observed mix stops moving in the second decimal place."

  # --- Phase-2 stub engine. Phase 4 replaces every key below this line ---------
  # The stub returns scripted outcomes so the harness can be tested before the
  # failure engine exists. None of these are measured.

  stub_engine.first_attempt_failure_rate:
