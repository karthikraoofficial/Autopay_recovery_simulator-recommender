    confidence: estimate

  stub_engine.reason_mix.account_frozen:
    value: 0.01
    unit: ratio
    source: "Placeholder reason-code mix."
    confidence: estimate

  stub_engine.retry_success_base.insufficient_funds:
    value: 0.28
    unit: ratio
    source: "Placeholder P(retry succeeds) on day 1 after this reason code."
    confidence: estimate

  stub_engine.retry_success_base.limit_exceeded:
    value: 0.35
    unit: ratio
    source: "Placeholder P(retry succeeds) on day 1 after this reason code."
    confidence: estimate

  stub_engine.retry_success_base.technical_decline:
    value: 0.80
    unit: ratio
    source: "Placeholder P(retry succeeds) on day 1 after this reason code."
    confidence: estimate

  stub_engine.retry_success_base.bank_unavailable:
    value: 0.75
