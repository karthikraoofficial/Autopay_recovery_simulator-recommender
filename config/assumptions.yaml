  # --- Population: balance process (SPEC §2.1) -----------------------------------
  # The emergent property these must produce is that P(insufficient funds) rises with
  # days since salary credit. Every value is a guess; the shape is the claim, not the
  # level, and phase 4 fits the level against a pilot merchant's reason-code mix.

  population.balance.spend_decay_rate.low:
    value: 0.075
    unit: ratio_per_day
    source: "Placeholder, back-solved so the median LOW-band account holds roughly 7% of a month's income when the next credit lands. Lower income is assumed to spend down fastest, so it is most exposed to a late-cycle debit."
    confidence: estimate
    notes: "Set by the end-of-cycle balance it implies, not measured. Raise it and late-cycle insufficient-funds risk saturates at 100%, which would make retry timing look worthless."

  population.balance.spend_decay_rate.mid:
    value: 0.060
    unit: ratio_per_day
    source: "Placeholder. See population.balance.spend_decay_rate.low."
    confidence: estimate

  population.balance.spend_decay_rate.high:
    value: 0.045
    unit: ratio_per_day
    source: "Placeholder. See population.balance.spend_decay_rate.low."
    confidence: estimate

  population.balance.first_week_days:
