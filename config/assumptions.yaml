# Everything at confidence: estimate must be listed here, plus the §11 items
# that do not yet have an entry above.
open_questions:
  - key: harness.performance_fee_rate
    question: "What fee rate do we actually intend to quote?"
  - key: harness.bootstrap_seeds
    question: "How many seeds until the CI is stable? Determine empirically at phase 2."
  - key: rail.upi_autopay.mandate_cap_default_inr
    question: "Current UPI Autopay default cap and the category list that exceeds it."
  - key: harness.max_attempts_per_cycle
    question: "Replace with the real per-rail cap once phase 5 establishes whether it is NPCI or PG policy."
  - key: harness.bootstrap_resamples
    question: "How many resamples until interval endpoints are stable?"
  - key: harness.confidence_level
    question: "90% or 95% for external claims? 95% is the defensible choice."
  - key: strategy.reason_aware.bank_unavailable_delay_hours
    question: "How long is a typical bank downtime window? BankAware in phase 7 should read the window directly rather than waiting a fixed period."
  - key: strategy.reason_aware.insufficient_funds_delay_days
    question: "How long should a retry wait after an insufficient-funds decline? This is the number SalaryAware replaces with an inferred salary date, so it sets the bar SalaryAware must beat."
  - key: strategy.reason_aware.invalid_pin_delay_days
    question: "INVALID_PIN is not applicable to autopay execution per SPEC.md §1.3; should this branch exist at all?"
  - key: strategy.reason_aware.max_retries
    question: "Should the strategy stop itself or be stopped by the compliance cap? They are currently equal, which hides which one is binding."
  - key: strategy.salary_aware.success_peak_probability
    question: "The inference likelihood is a guessed model of a process the strategy cannot observe. Should it instead be fitted online from the merchant's own outcome history?"
  - key: strategy.salary_aware.success_floor_probability
    question: "See strategy.salary_aware.success_peak_probability. The peak-to-floor contrast is what makes a salary day identifiable at all."
  - key: strategy.salary_aware.success_decay_per_day
    question: "See strategy.salary_aware.success_peak_probability."
  - key: strategy.salary_aware.min_observations
    question: "How much history does a salary date need before it is worth acting on? With one billing day per mandate the informative sample is small, which is the phase-7 finding."
  - key: strategy.salary_aware.min_log_likelihood_margin
    question: "What separation should count as an identified salary day rather than an argmax over noise? Chosen, not calibrated against a false-positive rate."
  - key: strategy.salary_aware.max_wait_days
    question: "How long may a retry be deferred to reach a predicted credit before the intent decay it causes outweighs the timing gained?"
  - key: strategy.salary_aware.max_retries
    question: "See strategy.reason_aware.max_retries."
  - key: strategy.bank_aware.earliest_hour
    question: "What hours can a merchant actually present on, per rail? The bank's batch cutoff is not in CustomerObservable, so these bounds stand in for it."
  - key: strategy.bank_aware.latest_hour
    question: "See strategy.bank_aware.earliest_hour."
  - key: strategy.bank_aware.prior_attempts
    question: "How much evidence should a (bank, hour) slot need before retry timing moves onto it? Governs explore-versus-exploit, and nothing here is measured."
  - key: strategy.bank_aware.prior_success_rate
    question: "See strategy.bank_aware.prior_attempts."
  - key: strategy.bank_aware.max_retries
    question: "See strategy.reason_aware.max_retries."
  - key: strategy.blended.weight_reason
    question: "The three blend weights are invented. Should they be fitted, and against what — recovery rate, or net of induced revocations?"
  - key: strategy.blended.weight_salary
    question: "See strategy.blended.weight_reason. Sensitivity to this weight is sensitivity to an inference phase 7 shows to be weak."
  - key: strategy.blended.weight_bank
    question: "See strategy.blended.weight_reason."
  - key: strategy.blended.max_retries
    question: "See strategy.reason_aware.max_retries."
  - key: harness.sensitivity.probability_ceiling
    question: "Not a question about the world. It exists because a ±50% sweep is not representable on a probability near 1; the affected keys are flagged clamped in the output."
  - key: harness.sensitivity.probability_floor
    question: "Should a reliability quantity near 1 be swept on its complement (downtime x1.5) rather than on its level, which would remove the need for a floor entirely and make the sweep mean what it says? Clamping is the conservative stand-in, not the right answer."
  - key: harness.sensitivity.seeds
    question: "How many seeds does the sweep need before a fragility ranking is stable rather than reshuffled by noise?"
  - key: harness.sensitivity.book_size
    question: "See harness.sensitivity.seeds."
  - key: harness.sensitivity.months
    question: "See harness.sensitivity.seeds. A short horizon starves the salary inference, so the sweep is conservative about SalaryAware by construction."
  - key: book.size
    question: "Book size, horizon and epoch are inputs, not findings. What does the pilot merchant's book actually look like?"
  - key: book.months
    question: "See book.size."
  - key: book.start_date
    question: "See book.size. Weekday alignment of the epoch shifts results via the weekend salary shift."
  - key: book.avg_ticket_paise
    question: "See book.size."
  - key: rail.enach.mandate_cap_inr
