  stub_engine.induced_revocation_prob_per_retry:
    value: 0.015
    unit: ratio
    source: "Placeholder. SPEC.md §2.3 requires retry aggression to carry a cost."
    confidence: estimate
    notes: "If this is zero, every strategy converges on retry-infinitely, which is the failure mode §2.3 warns about."

