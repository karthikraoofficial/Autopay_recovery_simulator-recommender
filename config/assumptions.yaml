# Every number used anywhere in rebound lives here. Nothing is hardcoded in Python.
#
# Entry schema (all fields required except `notes`):
#   <dotted.key>:
#     value:      number | string | bool
#     unit:       str    - "INR", "ratio", "days", "count", "hour_of_day", ...
#     source:     str    - where the number came from. If it is not from a
#                          document I can open, say so plainly. Never cite a
#                          circular that has not been read.
#     confidence: primary | practitioner | estimate
#     notes:      str    - optional; what would change this number
#
# confidence levels:
#   primary      - taken from an RBI/NPCI circular or a published NPCI data file
#   practitioner - stated by someone operating real mandate volume
#   estimate     - our guess. Must also appear in open_questions below.

version: 1

assumptions:
  harness.performance_fee_rate:
    value: 0.15
    unit: ratio
    source: "SPEC.md §5.1 default. Commercial parameter, not a measured quantity."
    confidence: estimate
    notes: "Set per merchant contract. Drives the net-to-merchant headline directly."

  harness.bootstrap_seeds:
    value: 50
    unit: count
    source: "SPEC.md §5.1 default. Chosen for runtime, not from a power calculation."
    confidence: estimate
    notes: "Raise until confidence intervals stop moving between runs."

  rail.upi_autopay.mandate_cap_default_inr:
    value: 15000
    unit: INR
    source: "SPEC.md §1.1, which itself flags this as unverified. No circular read."
    confidence: estimate
    notes: "Higher cap applies to select categories. Verify against current NPCI UPI Autopay circular before any external use."

  harness.max_attempts_per_cycle:
    value: 4
    unit: count
    source: "Runaway-loop stop for the phase-2 harness. Not a regulatory cap."
    confidence: estimate
    notes: "Runaway-loop stop only. The binding limit is now the per-rail compliance.max_retries_per_cycle.* cap, which is lower on every rail, so this should never be what truncates a chain."

  harness.bootstrap_resamples:
    value: 2000
    unit: count
    source: "Conventional bootstrap resample count. Not derived from a target CI width."
    confidence: estimate
    notes: "Raise until interval endpoints stop moving in the third significant figure."

  harness.confidence_level:
    value: 0.90
    unit: ratio
    source: "Chosen for a sales context, not a scientific one. 0.95 is the stricter default."
    confidence: estimate
    notes: "Widen to 0.95 before any external claim."

  harness.baseline_strategy:
    value: "FixedSchedule"
    unit: name
    source: "SPEC.md §4: everything is measured against what merchants do today."
    confidence: primary
    notes: "Paired lift intervals are computed as strategy minus this."

  harness.scheduler_reference_strategy:
    value: "NoReschedule"
    unit: name
    source: "Phase-7 audit. T+1/T+3/T+7 with blocked retries abandoned rather than re-presented -- what a merchant without a re-presenting scheduler actually runs today."
    confidence: primary
    notes: "The lower end of the headline decomposition. Reported lift is split at harness.baseline_strategy into a rescheduling half and a strategy half, because the first is scheduler plumbing and the second is retry logic, and quoting the total would sell one as the other."

  harness.floor_strategy:
    value: "NoRetry"
    unit: name
    source: "SPEC.md §4.2: the natural-recovery floor. Named here so the segment report can exclude it from the candidate set."
    confidence: primary
    notes: "A reference, not a candidate. Testing it for 'does it beat the baseline' asks a question with a known answer and spends a Bonferroni test on it, making every real comparison stricter for nothing."

  harness.headline_strategy:
    value: "Blended"
    unit: name
    source: "SPEC.md §4.6 and §6: the dashboard's single comparison is the baseline against Blended."
    confidence: primary
    notes: "The upper end of the headline decomposition."

  strategy.fixed_schedule.retry_offsets_days:
    value: [1, 3, 7]
    unit: days
    source: "SPEC.md §4.1 states T+1, T+3, T+7 as the common merchant default."
    confidence: practitioner
    notes: "Frozen by definition. Changing it changes what the baseline means, not how good it is."

  # --- Strategy: ReasonAware (SPEC §4.3) -------------------------------------------
  # Branch on the reason code. The delays below are the strategy's whole content, so a
  # lift result for ReasonAware is a claim about these six numbers. None is measured;
  # they encode the recovery characteristics SPEC §1.3 attaches to each code.

  strategy.reason_aware.technical_decline_delay_hours:
    value: 2
    unit: hours
    source: "SPEC.md §4.3 states 'technical decline -> retry in 2 hours' directly."
    confidence: practitioner
    notes: "Legal only while compliance.pre_debit_notification.retry_inherits_original_notice is true. Under the strict reading this retry is blocked outright and ReasonAware loses its main advantage over the baseline."

  strategy.reason_aware.bank_unavailable_delay_hours:
    value: 6
    unit: hours
    source: "Guess. SPEC.md §1.3 calls BANK_UNAVAILABLE very highly recoverable once the downtime window closes, but ReasonAware may not read downtime windows -- that is BankAware in phase 7 -- so it waits a fixed period instead."
    confidence: estimate

  strategy.reason_aware.insufficient_funds_delay_days:
    value: 3
    unit: days
    source: "Guess. SPEC.md §1.3 calls INSUFFICIENT_FUNDS a timing problem, so the strategy waits rather than hammering. Waiting for a predicted salary credit is SalaryAware in phase 7; this is the reason-blind version of the same instinct."
    confidence: estimate
    notes: "The single number ReasonAware's insufficient-funds branch rests on. Sweep it in phase 7 before quoting any lift attributable to this branch."

  strategy.reason_aware.limit_exceeded_delay_days:
    value: 1
    unit: days
    source: "SPEC.md §1.3: a daily or per-transaction cap resets, so the next day is the natural retry. Stated in the spec table, not measured."
    confidence: practitioner

  strategy.reason_aware.invalid_pin_delay_days:
    value: 1
    unit: days
    source: "Guess. SPEC.md §1.3 gives INVALID_PIN low recoverability and notes it does not apply to autopay execution, so this branch should almost never fire."
    confidence: estimate

  strategy.reason_aware.max_retries:
    value: 3
    unit: count
    source: "Matches the conservative per-rail compliance cap so the strategy stops on its own rather than being stopped by the guard. Not a regulatory number."
    confidence: estimate
    notes: "Set above compliance.max_retries_per_cycle.* and the guard blocks the surplus, which inflates the compliance-block count with retries the strategy should never have proposed."

  # --- Strategy: SalaryAware (SPEC §4.4) -----------------------------------------
  # The strategy must INFER the salary day from observable attempt history; it never
  # receives customer.salary_credit_day. The three probability numbers below are the
  # likelihood model that inference runs on. They are not measured, and they are not the
  # engine's real balance process either — that is the point: a merchant fitting a
  # salary date is fitting a wrong model to thin data, and the phase-7 finding is how
  # much accuracy that loses.

  strategy.salary_aware.success_peak_probability:
    value: 0.92
    unit: ratio
    source: "Guess. P(debit succeeds) on the day of a salary credit, as assumed by the inference model. Not read from the balance process, which the strategy cannot see."
    confidence: estimate

  strategy.salary_aware.success_floor_probability:
    value: 0.45
    unit: ratio
    source: "Guess. P(debit succeeds) far from any credit, as assumed by the inference model."
    confidence: estimate
    notes: "The gap between peak and floor is the contrast the inference has to detect. Narrow it and no candidate salary day separates from any other."

  strategy.salary_aware.success_decay_per_day:
    value: 0.08
    unit: ratio_per_day
    source: "Guess at how fast assumed success probability falls from peak to floor with days since credit. Shapes the likelihood, not the simulation."
    confidence: estimate

  strategy.salary_aware.min_observations:
    value: 4
    unit: count
    source: "Guess. Fewer informative attempts than this and the strategy declines to infer at all and falls back to the baseline schedule."
    confidence: estimate
    notes: "Only SUCCESS and INSUFFICIENT_FUNDS attempts are informative about balance timing; every other code says nothing about salary."

  strategy.salary_aware.min_log_likelihood_margin:
    value: 0.5
    unit: log_likelihood
    source: "Guess. How far the best candidate salary day must beat the mean candidate before the strategy will act on it. A refusal-to-guess threshold, not a fitted one."
    confidence: estimate
    notes: "Set to 0 and the strategy always commits to an argmax, including on a flat likelihood, which converts pure noise into confident retry timing."

  strategy.salary_aware.target_window_days:
    value: 2
    unit: days
    source: "SPEC.md §4.4 says land the retry 0-2 days after the predicted credit."
    confidence: practitioner

  strategy.salary_aware.max_wait_days:
    value: 12
    unit: days
    source: "Guess. Cap on how far past the baseline offset a retry may be pushed to reach a predicted credit. Without it a retry can be deferred into the next billing cycle."
    confidence: estimate
    notes: "Binding often: a debit just after a credit has to wait most of a month for the next one, and waiting that long costs intent decay and revocation risk."

  strategy.salary_aware.max_retries:
    value: 3
    unit: count
    source: "Matches the conservative per-rail compliance cap, as with ReasonAware."
    confidence: estimate

  # --- Strategy: BankAware (SPEC §4.5) -------------------------------------------
  # Prefers time-of-day slots at which this bank has been observed to succeed. The tally
  # is built from attempts the strategy itself has seen across the merchant's own book —
  # observable data, not ground truth — so it starts uninformed and learns within a run.

  strategy.bank_aware.earliest_hour:
    value: 7
    unit: hour_of_day
    source: "Guess. Lower bound of the hours the strategy will schedule into, chosen to sit clear of overnight batch and maintenance hours and inside a plausible presentation window."
    confidence: estimate

  strategy.bank_aware.latest_hour:
    value: 16
    unit: hour_of_day
    source: "Guess. Upper bound of the schedulable hours, set below population.bank.batch_cutoff_hour so an eNACH retry is not proposed past a cutoff the strategy cannot see."
    confidence: estimate
    notes: "The bank's actual cutoff is not in CustomerObservable. If this rises above the real cutoff, eNACH retries start being blocked by the presentation-window rule rather than executing."

  strategy.bank_aware.prior_attempts:
    value: 8.0
    unit: count
    source: "Guess. Strength of the uninformative prior on an untried (bank, hour) slot, in pseudo-attempts. Higher means more evidence is needed before the strategy moves off its default hour."
    confidence: estimate
    notes: "This is what stops one lucky observation from pinning every future retry to one hour."

  strategy.bank_aware.prior_success_rate:
    value: 0.8
    unit: ratio
    source: "Guess at the prior mean success rate of an unobserved slot. Optimistic on purpose, so unexplored hours are not written off before they are tried."
    confidence: estimate

  strategy.bank_aware.max_retries:
    value: 3
    unit: count
    source: "Matches the conservative per-rail compliance cap, as with ReasonAware."
    confidence: estimate

  # --- Strategy: Blended (SPEC §4.6) ---------------------------------------------
  # Combines 3-5 with a scoring function. The weights decide which signal wins when they
  # disagree; none is fitted, so a Blended lift number is a claim about these three.

  strategy.blended.weight_reason:
    value: 1.0
    unit: ratio
    source: "Reference weight. The reason-code branch is the only component with a stated basis in SPEC.md §4.3, so the other two are scaled against it."
    confidence: estimate

  strategy.blended.weight_salary:
    value: 0.8
    unit: ratio
    source: "Guess. Discounted below the reason weight because the salary date is inferred rather than observed, and the inference is unreliable."
    confidence: estimate
    notes: "Sweep this first. If Blended's lift is sensitive to it, the lift is coming from an inference that phase 7 shows to be weak."

  strategy.blended.weight_bank:
    value: 0.6
    unit: ratio
    source: "Guess. Lowest of the three because the bank tally starts empty and is thin for most of a run."
    confidence: estimate

  strategy.blended.max_retries:
    value: 3
    unit: count
    source: "Matches the conservative per-rail compliance cap, as with ReasonAware."
    confidence: estimate

  # --- Sensitivity analysis (SPEC §5.1) ------------------------------------------
  # The sweep reruns the whole paired experiment once per assumption per direction, so
  # its book and seed count are set by runtime rather than by precision. A conclusion
  # that only survives at these settings is not a conclusion.

  harness.sensitivity.sweep_factor:
    value: 0.5
    unit: ratio
    source: "SPEC.md §5.1 states ±50%."
    confidence: primary

  harness.sensitivity.probability_ceiling:
    value: 0.999
    unit: ratio
    source: "Not a modelled quantity. A probability at 1.0 makes some likelihoods degenerate, so an upward sweep that would exceed 1 stops just below it instead."
    confidence: estimate
    notes: "Every point clamped by this is flagged in the sweep output. A clamped key's upward sensitivity is understated by construction, because the sweep it was asked for is not representable."

  harness.sensitivity.probability_floor:
    value: 0.90
    unit: ratio
    source: "Not a modelled quantity. A guard so that a reliability figure near 1 cannot be halved into a world nobody is claiming could happen."
    confidence: estimate
    notes: "Applies ONLY where the unswept value already sits above it, so small probabilities sweep freely: a 0.005 technical-decline rate halves to 0.0025 untouched. Added after the first phase-7 sweep, where population.bank.uptime_daytime swept from 0.995 to 0.4975 -- banks offline half the time -- and that world produced a lift 118x the base, dominating the fragility ranking. WHAT A CLAMP MEANS: a clamped key is no longer being swept +/-50%, it is being swept over a narrowed range, so its swing is NOT comparable to an unclamped key's. A small swing on a clamped key is not evidence of robustness. Every clamped key is listed explicitly in the sweep output for that reason. The principled fix for reliability quantities is to sweep the complement (downtime) rather than the level, which would need no clamp at all; that is an open question below."

  harness.sensitivity.seeds:
    value: 12
    unit: count
    source: "Chosen for runtime: the sweep runs a full paired experiment per assumption per direction. Far below harness.bootstrap_seeds."
    confidence: estimate
    notes: "Intervals from the sweep are wider than the headline intervals for this reason and are not interchangeable with them."

  harness.sensitivity.book_size:
    value: 400
    unit: count
    source: "Chosen for runtime, as harness.sensitivity.seeds. Smaller than book.size."
    confidence: estimate

  harness.sensitivity.months:
    value: 6
    unit: count
    source: "Chosen for runtime, as harness.sensitivity.seeds. Shorter than book.months."
    confidence: estimate
    notes: "A shorter horizon gives SalaryAware less history to infer from, so the sweep understates any inference-driven strategy relative to a 12-month run."

  # --- Book shape ---------------------------------------------------------------
  # What is being simulated, as distinct from how the population is distributed.

  book.size:
    value: 2000
    unit: count
    source: "Chosen for test runtime. No merchant basis."
    confidence: estimate

  book.months:
    value: 12
    unit: count
    source: "SPEC.md §6 renders a 12-month chart."
    confidence: estimate

  book.start_date:
    value: "2026-01-01"
    unit: date
    source: "Simulation epoch. Arbitrary, but results depend on it via weekday alignment."
    confidence: estimate

  book.avg_ticket_paise:
    value: 49900
    unit: paise
    source: "Placeholder subscription ticket. No merchant basis."
    confidence: estimate

  # --- Rail mandate caps ---------------------------------------------------------
  # Regulatory/scheme ceilings, not book parameters. A generated mandate cap is
  # clipped to these, so a merchant cannot be simulated debiting above the rail limit.

  rail.enach.mandate_cap_inr:
    value: 10000000
    unit: INR
    source: "SPEC.md §1.1 states 'caps up to ₹1 crore'. No NPCI circular read."
    confidence: estimate
    notes: "Verify against the current NACH procedural guidelines before external use."

  rail.card_emandate.mandate_cap_inr:
    value: 1500000
    unit: INR
    source: "Guess. SPEC.md §1.1 gives an AFA threshold for cards, not a mandate ceiling; the two are different things and we have read neither circular."
    confidence: estimate
    notes: "The ₹15,000 figure in SPEC.md §1.1 is the additional-factor-of-authentication threshold. Modelling it as a hard cap would be wrong; this is a separate, invented ceiling."

  # --- Population: banks ---------------------------------------------------------
  # Phase 3. Every value here is a guess about the Indian banking system. NPCI
  # publishes per-bank technical-decline and uptime data monthly; none of it has been
  # read, and until it is, no per-bank number in this file is defensible.

  population.bank.count:
    value: 12
    unit: count
    source: "Placeholder. Real books concentrate in far fewer banks than they touch."
    confidence: estimate

  population.bank.share_concentration:
    value: 1.1
    unit: exponent
    source: "Zipf exponent on bank market share. Chosen to make a book concentrate in a handful of banks rather than spread uniformly. Not fitted."
    confidence: estimate
    notes: "0 gives a uniform book. Higher concentrates further. Drives how much a BankAware strategy can matter, so lift is sensitive to it."

  population.bank.td_rate_min:
    value: 0.005
    unit: ratio
    source: "Placeholder range for per-bank technical decline rate."
    confidence: estimate

  population.bank.td_rate_max:
    value: 0.045
    unit: ratio
    source: "Placeholder range for per-bank technical decline rate."
    confidence: estimate

  population.bank.uptime_daytime:
    value: 0.995
    unit: ratio
    source: "Placeholder best-hour availability for a median bank."
    confidence: estimate

  population.bank.uptime_night_trough:
    value: 0.955
    unit: ratio
    source: "Placeholder worst-hour availability for a median bank. Assumes a nightly dip around batch/maintenance hours."
    confidence: estimate

  population.bank.uptime_trough_hour:
    value: 2
    unit: hour_of_day
    source: "Placeholder hour of worst availability. Assumed to sit in the early morning."
    confidence: estimate

  population.bank.unavailability_factor_min:
    value: 0.4
    unit: ratio
    source: "Multiplier on a bank's downtime relative to the median bank; the low end is the best bank in the book."
    confidence: estimate

  population.bank.unavailability_factor_max:
    value: 2.5
    unit: ratio
    source: "Multiplier on a bank's downtime relative to the median bank; the high end is the worst bank in the book."
    confidence: estimate

  population.bank.downtime_windows_mean:
    value: 0.8
    unit: count
    source: "Placeholder mean number of recurring scheduled downtime windows per bank."
    confidence: estimate

  population.bank.downtime_windows_max:
    value: 2
    unit: count
    source: "Cap on the Poisson draw above, so no bank is generated permanently offline."
    confidence: estimate

  population.bank.downtime_window_hours:
    value: 2
    unit: hours
    source: "Placeholder length of a scheduled maintenance window."
    confidence: estimate

  population.bank.downtime_window_earliest_hour:
    value: 0
